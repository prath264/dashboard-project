services:
  db:
    image: postgres:${PG_MAJOR}-alpine
    container_name: mmrcl-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: mmrcl-backend
    restart: unless-stopped
    depends_on:
      - db
    ports:
      - "8000:8000"
    environment:
      CORS_ORIGINS: "http://localhost:3000,http://127.0.0.1:3000"
      DATABASE_URL: "postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}"
      JWT_SECRET_KEY: i8VkJbPaPnjyzHRMkFXp4wswsPvS6ZHh1IeQwBzLCkII5OPo3xnBeioTNFXHMd8kbKb4wXR-uhXBabGhKz_Pqw

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: mmrcl-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "3000:80"

volumes:
  pgdata: